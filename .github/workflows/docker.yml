name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild to pick up base-image and OS fixes (Saturday 07:00 UTC)
  schedule:
    - cron: '0 7 * * 6'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/esemwy/travellermap:latest
            ghcr.io/esemwy/travellermap:${{ github.sha }}

      # Fail the run (GitHub emails on failure) if the image has fixable
      # HIGH/CRITICAL vulnerabilities
      - name: Scan image with Trivy
        run: >
          docker run --rm -v "$HOME/.docker:/root/.docker:ro"
          aquasec/trivy:0.75.0 image
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          ghcr.io/esemwy/travellermap:${{ github.sha }}
